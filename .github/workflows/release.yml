name: Build & Release

# v3 (Runtime Pack):
#   - Setup LITE (~130MB): app puro. E o UNICO no latest.yml — todo
#     auto-update baixa so ele (antes: 530MB por release com snapshot).
#   - Setup FULL (~380MB): LITE + MyZap Runtime Pack embutido em resources/
#     — instalador de primeira instalacao 100% offline (pendrive/link).
#     Gerado apenas se o canal do myzap tiver release publicada.
#   O pack vem do canal do repo myzap (releases/latest), pinado por download
#   no momento do build e conferido pelo manifest.

on:
  push:
    branches: ['main']
    # Documentacao nao publica release: docs/ e *.md editam livre sem
    # rebuildar instalador para a frota. (Commits mistos ainda disparam.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.actor != 'github-actions'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runtime Pack do canal do myzap -> embutido no Setup FULL.
      # Sem release no canal ainda: segue so com o LITE (continue-on-error).
      - name: Baixar MyZap Runtime Pack (canal)
        id: pack
        continue-on-error: true
        run: |
          gh release download -R JZ-TECH-SYS/myzap --pattern "myzap-pack-win32-x64.*" -D build/pack
          Get-ChildItem build/pack
          "found=true" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Setup LITE (feed do auto-update)
        run: pnpm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Setup FULL (offline, pack embutido)
        if: steps.pack.outputs.found == 'true'
        run: pnpm exec electron-builder --win --x64 --config build/full.config.js --config.directories.output=dist/full --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/full/*FULL*.exe

  build-linux:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux (electron-builder)
        run: pnpm run dist:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
            dist/*.blockmap

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          draft: false
          files: |
            dist/*.exe
            dist/latest.yml
            dist/full/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
